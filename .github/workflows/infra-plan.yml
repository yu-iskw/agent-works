name: Infra read-only plan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - infra/terraform/**
      - .github/workflows/infra-plan.yml

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: vars.TF_PLAN_WIF_PROVIDER != '' && vars.TF_PLAN_SA != ''
    environment: dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_project_id: ${{ vars.TF_PROJECT_ID }}
      TF_VAR_project_number: ${{ vars.TF_PROJECT_NUMBER }}
      TF_VAR_billing_account_id: ${{ vars.TF_BILLING_ACCOUNT_ID }}
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_terraform_service_account: ${{ vars.TF_PLAN_SA }}
      TF_PLAN_SA: ${{ vars.TF_PLAN_SA }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: GitHub WIF source for aw-tf-plan impersonation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.TF_PLAN_WIF_PROVIDER }}
          project_id: ${{ vars.TF_PROJECT_ID }}
          # Direct WIF source: both Terraform provider and backend impersonate
          # TF_PLAN_SA. Avoid a second self-impersonation hop or self-tokenCreator.
          create_credentials_file: true
      - name: Initialize reviewed read-only state
        run: >-
          terraform -chdir=infra/terraform/environments/dev init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="impersonate_service_account=$TF_PLAN_SA"
      - name: Read-only plan
        run: terraform -chdir=infra/terraform/environments/dev plan -lock=false -input=false
