# yamllint disable rule:line-length rule:document-start rule:truthy rule:comments

name: Deploy Dev

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target deployment environment (dev only)
        required: true
        default: dev
        type: choice
        options:
          - dev
      sha:
        description: Full 40-hex commit SHA on origin/main to deploy
        required: true
        type: string
      approval_ref:
        description: Reference to the filled operator approval request for this exact SHA and these digests
        required: true
        type: string
      web_image:
        description: Digest-pinned aw-web image in aw-images (@sha256:...)
        required: true
        type: string
      api_image:
        description: Digest-pinned aw-api image in aw-images (@sha256:...)
        required: true
        type: string

permissions: read-all

concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: deploy-dev
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.environment == 'dev'
    environment: dev
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      CLOUD_RUN_REGION: asia-northeast1
      TF_PROJECT_ID: ${{ vars.TF_PROJECT_ID }}
      DEPLOY_WIF_PROVIDER: ${{ vars.DEPLOY_WIF_PROVIDER }}
      DEPLOYER_SA: ${{ vars.DEPLOYER_SA }}
      INPUT_ENVIRONMENT: ${{ inputs.environment }}
      DEPLOY_SHA: ${{ inputs.sha }}
      APPROVAL_REF: ${{ inputs.approval_ref }}
      WEB_IMAGE: ${{ inputs.web_image }}
      API_IMAGE: ${{ inputs.api_image }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate environment, commit ancestry, and digest-pinned images
        shell: bash
        run: |
          set -euo pipefail

          node e2e/dev/validate-deploy-inputs.mjs

          if ! git cat-file -e "${DEPLOY_SHA}^{commit}" 2>/dev/null; then
            echo "Refusing deployment: commit ${DEPLOY_SHA} not found." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$DEPLOY_SHA" origin/main; then
            echo "Refusing deployment: ${DEPLOY_SHA} not on origin/main." >&2
            exit 1
          fi

          git checkout --detach "$DEPLOY_SHA"
          checked_out="$(git rev-parse HEAD)"
          if [[ "$checked_out" != "$DEPLOY_SHA" ]]; then
            echo "Checkout verification failed." >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud via WIF (aw-deployer)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.DEPLOY_WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
          project_id: ${{ vars.TF_PROJECT_ID }}

      - name: Verify digests exist and guard rails hold before any update
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p e2e/artifacts

          for image in "$API_IMAGE" "$WEB_IMAGE"; do
            resolved="$(
              gcloud artifacts docker images describe "$image" \
                --project="$TF_PROJECT_ID" \
                --format='value(image_summary.digest)'
            )"
            if [[ "$resolved" != "${image##*@}" ]]; then
              echo "Refusing deployment: ${image} does not resolve to its pinned digest in Artifact Registry." >&2
              exit 1
            fi
          done

          for service in aw-api aw-web; do
            gcloud run services describe "$service" \
              --project="$TF_PROJECT_ID" \
              --region="$CLOUD_RUN_REGION" \
              --format=json > "${RUNNER_TEMP}/${service}.before.json"
          done

          python3 - "${RUNNER_TEMP}/aw-api.before.json" "${RUNNER_TEMP}/aw-web.before.json" <<'PY'
          import json
          import sys

          api = json.load(open(sys.argv[1], encoding="utf-8"))
          web = json.load(open(sys.argv[2], encoding="utf-8"))

          def container(service):
              return service["spec"]["template"]["spec"]["containers"][0]

          env = {item.get("name"): item.get("value") for item in container(api).get("env", [])}
          if env.get("AW_MODE") != "production":
              sys.exit("Refusing deployment: aw-api must run with AW_MODE=production so fake providers are rejected at startup.")
          ingress = api["metadata"].get("annotations", {}).get("run.googleapis.com/ingress")
          if ingress != "internal":
              sys.exit("Refusing deployment: aw-api ingress must be internal-only, found " + str(ingress))
          previous = {"aw-api": container(api)["image"], "aw-web": container(web)["image"]}
          with open("e2e/artifacts/previous-images.json", "w", encoding="utf-8") as handle:
              json.dump(previous, handle, indent=2)
              handle.write("\n")
          PY

      - name: Update Cloud Run revisions (aw-api and aw-web) and wait for latestReadyRevision
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p e2e/artifacts

          deploy_started_ms="$(date +%s%3N)"

          gcloud run services update aw-api \
            --project="$TF_PROJECT_ID" \
            --region="$CLOUD_RUN_REGION" \
            --image="$API_IMAGE" \
            --quiet

          gcloud run services update aw-web \
            --project="$TF_PROJECT_ID" \
            --region="$CLOUD_RUN_REGION" \
            --image="$WEB_IMAGE" \
            --quiet

          api_revision="$(
            gcloud run services describe aw-api \
              --project="$TF_PROJECT_ID" \
              --region="$CLOUD_RUN_REGION" \
              --format='value(status.latestReadyRevisionName)'
          )"
          api_created_revision="$(
            gcloud run services describe aw-api \
              --project="$TF_PROJECT_ID" \
              --region="$CLOUD_RUN_REGION" \
              --format='value(status.latestCreatedRevisionName)'
          )"
          if [[ -z "$api_revision" || "$api_revision" != "$api_created_revision" ]]; then
            echo "aw-api latestReadyRevisionName (${api_revision}) does not match latestCreatedRevisionName (${api_created_revision})." >&2
            exit 1
          fi

          web_revision="$(
            gcloud run services describe aw-web \
              --project="$TF_PROJECT_ID" \
              --region="$CLOUD_RUN_REGION" \
              --format='value(status.latestReadyRevisionName)'
          )"
          web_created_revision="$(
            gcloud run services describe aw-web \
              --project="$TF_PROJECT_ID" \
              --region="$CLOUD_RUN_REGION" \
              --format='value(status.latestCreatedRevisionName)'
          )"
          if [[ -z "$web_revision" || "$web_revision" != "$web_created_revision" ]]; then
            echo "aw-web latestReadyRevisionName (${web_revision}) does not match latestCreatedRevisionName (${web_created_revision})." >&2
            exit 1
          fi

          deploy_finished_ms="$(date +%s%3N)"
          deploy_wall_ms="$((deploy_finished_ms - deploy_started_ms))"
          api_digest="${API_IMAGE##*@}"
          web_digest="${WEB_IMAGE##*@}"

          for service in aw-api aw-web; do
            gcloud run services describe "$service" \
              --project="$TF_PROJECT_ID" \
              --region="$CLOUD_RUN_REGION" \
              --format=json > "${RUNNER_TEMP}/${service}.after.json"
          done

          python3 - \
            "$DEPLOY_SHA" \
            "$CLOUD_RUN_REGION" \
            "$WEB_IMAGE" \
            "$web_digest" \
            "$web_revision" \
            "$API_IMAGE" \
            "$api_digest" \
            "$api_revision" \
            "$deploy_wall_ms" \
            "$APPROVAL_REF" \
            "${RUNNER_TEMP}/aw-web.after.json" \
            "${RUNNER_TEMP}/aw-api.after.json" <<'PY'
          import json
          import sys

          (
              sha,
              region,
              web_image,
              web_digest,
              web_revision,
              api_image,
              api_digest,
              api_revision,
              deploy_wall_ms,
              approval_ref,
              web_after,
              api_after,
          ) = sys.argv[1:]

          def verified(name, path, expected):
              service = json.load(open(path, encoding="utf-8"))
              served = service["spec"]["template"]["spec"]["containers"][0]["image"]
              if served != expected:
                  sys.exit(f"{name} serving image {served} does not match requested {expected}")
              traffic = service["status"].get("traffic", [])
              if not any(t.get("latestRevision") and t.get("percent") == 100 for t in traffic):
                  sys.exit(f"{name} is not sending 100% of traffic to its latestRevision")
              return service["status"].get("url", "")

          web_url = verified("aw-web", web_after, web_image)
          verified("aw-api", api_after, api_image)
          previous = json.load(open("e2e/artifacts/previous-images.json", encoding="utf-8"))

          summary = {
              "environment": "dev",
              "region": region,
              "commitSha": sha,
              "approvalRef": approval_ref,
              "deployWallTimeMs": int(deploy_wall_ms),
              "previousImages": previous,
              "services": {
                  "aw-web": {
                      "image": web_image,
                      "digest": web_digest,
                      "revision": web_revision,
                      "url": web_url,
                  },
                  "aw-api": {
                      "image": api_image,
                      "digest": api_digest,
                      "revision": api_revision,
                  },
              },
          }
          with open("e2e/artifacts/deploy-summary.json", "w", encoding="utf-8") as handle:
              json.dump(summary, handle, indent=2)
              handle.write("\n")
          PY

          {
            echo "## Dev Cloud Run Deployment Summary"
            echo ""
            echo "- **Environment:** \`dev\`"
            echo "- **Region:** \`${CLOUD_RUN_REGION}\`"
            echo "- **Commit SHA:** \`${DEPLOY_SHA}\`"
            echo "- **Approval reference:** \`${APPROVAL_REF}\`"
            echo "- **Deploy wall time:** \`${deploy_wall_ms} ms\`"
            echo ""
            echo "| Service | Revision | Digest | Image Reference |"
            echo "| ------- | -------- | ------ | --------------- |"
            echo "| \`aw-api\` | \`${api_revision}\` | \`${api_digest}\` | \`${API_IMAGE}\` |"
            echo "| \`aw-web\` | \`${web_revision}\` | \`${web_digest}\` | \`${WEB_IMAGE}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized deploy summary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy-dev-${{ inputs.sha }}
          path: e2e/artifacts/deploy-summary.json
          if-no-files-found: error
