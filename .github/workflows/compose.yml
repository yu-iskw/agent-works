name: Compose

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  compose-config:
    name: Validate docker compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Validate compose.yaml
        run: docker compose --env-file .env.example config --quiet

      - name: Validate compose.yaml with the otel profile
        run: docker compose --env-file .env.example --profile otel config --quiet

      - name: Validate compose.dev.yml
        run: docker compose -f compose.dev.yml config --quiet

      - name: Require GOOGLE_CLOUD_PROJECT
        run: |
          if env -u GOOGLE_CLOUD_PROJECT docker compose --env-file /dev/null config --quiet 2>err.log; then
            echo "compose.yaml must require GOOGLE_CLOUD_PROJECT" >&2
            exit 1
          fi
          grep -q GOOGLE_CLOUD_PROJECT err.log
