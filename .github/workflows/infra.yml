name: Infra Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  infra-check:
    name: infra-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Terraform fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive -diff

      - name: No identities in modules
        run: node --test infra/terraform/evidence.test.mjs

      - name: Offline init, validate and mock plan tests
        shell: bash
        run: |
          for root in infra/terraform/bootstrap infra/terraform/identity/dev infra/terraform/environments/dev infra/terraform/modules/*; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
            terraform -chdir="$root" test
          done

      - name: TFLint
        run: tflint --chdir=infra/terraform --recursive

      - name: Checkov
        run: pipx run --spec checkov==3.3.26 checkov --directory infra/terraform --framework terraform --skip-download --compact --quiet

      - name: Evidence tests
        run: node --test infra/terraform/evidence.test.mjs

      - name: Negative control and evidence
        run: node infra/terraform/evidence.mjs

      - name: Upload infra evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: infra-evidence-${{ github.sha }}
          path: infra/terraform/evidence-artifacts
          if-no-files-found: error
