x-node-healthcheck: &node-healthcheck
  test:
    - CMD
    - node
    - -e
    - fetch('http://127.0.0.1:8080/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
  interval: 2s
  timeout: 3s
  retries: 30
  start_period: 3s

x-node: &node
  image: node:24.13.0-bookworm-slim
  working_dir: /workspace
  init: true
  volumes:
    - .:/workspace:ro
  healthcheck: *node-healthcheck

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -h, 127.0.0.1]
      interval: 2s
      timeout: 3s
      retries: 30
  fake-iap:
    <<: *node
    command: node packages/fakes/dist/main.js iap
    environment:
      UPSTREAM_URL: http://web:8080
    ports:
      - 127.0.0.1:8081:8080
  fake-drive:
    <<: *node
    command: node packages/fakes/dist/main.js drive
    ports:
      - 127.0.0.1:8082:8080
  fake-llm:
    <<: *node
    command: node packages/fakes/dist/main.js llm
    ports:
      - 127.0.0.1:8083:8080
  api:
    <<: *node
    command: node apps/api/dist/server.js
    ports:
      - 127.0.0.1:8084:8080
  web:
    <<: *node
    command: node apps/web/dist/server.js
    ports:
      - 127.0.0.1:8085:8080
