x-node-healthcheck: &node-healthcheck
  test:
    - CMD
    - node
    - -e
    - fetch('http://127.0.0.1:8080/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
  interval: 2s
  timeout: 3s
  retries: 30
  start_period: 3s

x-node: &node
  image: node:24.13.0-bookworm-slim
  working_dir: /workspace
  init: true
  volumes:
    - .:/workspace:ro
  healthcheck: *node-healthcheck

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -h, 127.0.0.1]
      interval: 2s
      timeout: 3s
      retries: 30
  fake-iap:
    <<: *node
    command: node packages/fakes/dist/main.js iap
    environment:
      UPSTREAM_URL: http://web:8080
    ports:
      - 127.0.0.1:8081:8080
  fake-directory:
    <<: *node
    command: node packages/fakes/dist/main.js directory
    ports:
      - 127.0.0.1:8086:8080
  fake-drive:
    <<: *node
    command: node packages/fakes/dist/main.js drive
    environment:
      DIRECTORY_URL: http://fake-directory:8080
    depends_on:
      fake-directory:
        condition: service_healthy
    ports:
      - 127.0.0.1:8082:8080
  fake-llm:
    <<: *node
    command: node packages/fakes/dist/main.js llm
    ports:
      - 127.0.0.1:8083:8080
  fake-workspace:
    <<: *node
    command: node packages/fakes/dist/main.js workspace
    ports:
      - 127.0.0.1:8087:8080
  api:
    <<: *node
    command: node apps/api/dist/server.js
    environment:
      AW_DEV_STACK: '1'
      OAUTH_URL: http://fake-workspace:8080
      OAUTH_PUBLIC_URL: http://localhost:8087
      DATABASE_URL: postgres://postgres@postgres:5432/postgres
      DRIVE_URL: http://fake-drive:8080
      DIRECTORY_URL: http://fake-directory:8080
      LLM_URL: http://fake-llm:8080
      OAUTH_REDIRECT_URI: http://localhost:8081/oauth/callback
      IAP_JWKS_URL: http://fake-iap:8080/jwks
      IAP_ISSUER: https://fake-iap.local
      IAP_AUDIENCE: agent-works-dev
    depends_on:
      fake-workspace:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - 127.0.0.1:8084:8080
  web:
    <<: *node
    command: node apps/web/dist/src/server.js
    environment:
      AW_DEV_STACK: '1'
      API_URL: http://api:8080
    ports:
      - 127.0.0.1:8085:8080
  otel-collector:
    profiles: [otel]
    image: otel/opentelemetry-collector-contrib:0.128.0
    user: '0'
    volumes:
      - ./apps/api/src/telemetry/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otel-traces:/var/log/otel
    ports:
      - 127.0.0.1:4318:4318

volumes:
  otel-traces:
